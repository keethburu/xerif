name: Lightweight CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lightweight-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  xml-syntax:
    name: XML syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Test checker with valid and invalid fixtures
        run: python3 -B -m unittest discover -s tests -v
      - name: Check tracked XML sources
        run: python3 -B scripts/check_xml.py
