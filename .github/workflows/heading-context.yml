name: Heading context

on:
  pull_request:
    branches: [scripello/heading-context]
  push:
    branches: [fm/xerif-heading-context-backport, scripello/heading-context]

permissions:
  contents: read

concurrency:
  group: heading-context-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  heading-context:
    name: Heading context regression
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.3'
      - name: Install pinned regression dependencies
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/heading-requirements.txt" <<'EOF'
          lxml==5.2.1 --hash=sha256:f0a1bc63a465b6d72569a9bba9f2ef0334c4e03958e043da1920299100bc7c08
          saxonche==12.9.0 --hash=sha256:490f30e9486750f6a066de2b467114dfd6e14d23c8ce645cad64e663f580490a
          EOF
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/heading-requirements.txt"
      - name: Fetch checksum-pinned mapping inputs
        shell: bash
        run: |
          curl --fail --location --retry 2 --max-time 30 https://raw.githubusercontent.com/transpect/docx2tex/6e1ffe7d259888f47ab3f311edc24b2e4c69147b/conf/conf.xml -o "$RUNNER_TEMP/docx2tex-conf.xml"
          curl --fail --location --retry 2 --max-time 30 https://raw.githubusercontent.com/keethburu/xerif/1b66ab8984fc3a1e9eee942912d3cf040fbad515/xml2tex/latex.conf.xml -o "$RUNNER_TEMP/heading-baseline.xml"
          printf '%s  %s\n' dee9e30f77fd71e473494cf3958b14f2e2d6f652bbc76e3384e7d74738f7c1e9 "$RUNNER_TEMP/docx2tex-conf.xml" | sha256sum --check -
          printf '%s  %s\n' 283e0f2a6ba4be592f8c531b19860f0575d884cd4c40cbf097b1ba6f9275f947 "$RUNNER_TEMP/heading-baseline.xml" | sha256sum --check -
      - name: Run heading regression
        run: python -B tests/heading-style-context.py --docx2tex-conf "$RUNNER_TEMP/docx2tex-conf.xml"
      - name: Require installed-baseline negative control to fail its output assertions
        shell: bash
        run: |
          if python -B tests/heading-style-context.py --docx2tex-conf "$RUNNER_TEMP/docx2tex-conf.xml" --config "$RUNNER_TEMP/heading-baseline.xml" > "$RUNNER_TEMP/heading-negative.log" 2>&1; then
            cat "$RUNNER_TEMP/heading-negative.log"
            echo 'Installed baseline unexpectedly passed the heading regression.' >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/heading-negative.log"
          python - "$RUNNER_TEMP/heading-negative.log" <<'PY'
          from pathlib import Path
          import sys
          log = Path(sys.argv[1]).read_text()
          assert 'AssertionError: body-stripped\nexpected:' in log, log
          assert '\nactual:' in log, log
          PY
